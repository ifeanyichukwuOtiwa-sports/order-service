server:
  port: 9002
  shutdown: graceful
  netty:
    connection-timeout: PT2S
    idle-timeout: PT15S

spring:
  application:
    name: 'order-service'
  lifecycle:
    timeout-per-shutdown-phase: PT15S

  r2dbc:
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:password}
    url: ${DB_URL:r2dbc:postgresql://localhost:5433/polardb_order}
    pool:
      max-size: 10
      initial-size: 5
      max-create-connection-time: PT2S
  flyway:
    user: ${spring.r2dbc.username}
    password: ${spring.r2dbc.password}
    url: jdbc:postgresql://localhost:5433/polardb_order
    enabled: true

polar:
  catalog-service-uri: "http://localhost:9001"
  catalog-service-client-timeout: PT3S
