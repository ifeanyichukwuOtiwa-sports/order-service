apiVersion: apps/v1
kind: Deployment
metadata:
  name: polar-order-postgres
  labels:
    db: polar-order-postgres
spec:
  selector:
    matchLabels:
      db: polar-order-postgres
  template:
    metadata:
      labels:
        db: polar-order-postgres

    spec:
      containers:
        - name: polar-order-postgres
          image: "postgres:14.12"
          env:
            - name: POSTGRES_USER
              value: user
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: polardb_order

          resources:
            requests:
              cpu: 100m
              memory: 60Mi
            limits:
              cpu: 200m
              memory: 120Mi
